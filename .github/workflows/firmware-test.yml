name: ESP32 Firmware Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'src/firmware/**'
      - '.github/workflows/firmware-test.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'src/firmware/**'
      - '.github/workflows/firmware-test.yml'

jobs:
  firmware-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true
        components: rustfmt, clippy
    
    - name: Install ESP-IDF dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git wget flex bison gperf python3 python3-pip python3-venv cmake ninja-build ccache libffi-dev libssl-dev dfu-util libusb-1.0-0
    
    - name: Install ESP-IDF Rust target
      run: |
        # Note: In a real CI environment, you would install the full ESP-IDF toolchain
        # For now, we'll test the project structure and build process
        echo "ESP-IDF toolchain installation would go here"
    
    - name: Cache cargo registry
      uses: actions/cache@v3
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Cache cargo index
      uses: actions/cache@v3
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Test main project (excluding firmware)
      run: |
        cargo test --workspace --features native
    
    - name: Run firmware tests
      run: |
        cd src/firmware
        ./run_tests.sh

  code-quality:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true
        components: rustfmt, clippy
    
    - name: Check formatting
      run: cargo fmt --all -- --check
    
    - name: Run clippy (main project only)
      run: cargo clippy --workspace --features native -- -D warnings