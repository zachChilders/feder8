[package]
name = "feder8-firmware"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "feder8-firmware"
path = "src/main.rs"

[[bin]]
name = "run-sim"
path = "src/sim_runner.rs"

[[bin]]
name = "test-runner"
path = "test_runner.rs"

# Test configuration
[dev-dependencies]
tokio-test = "0.4"

[dependencies]
esp-idf-sys = { version = "0.33", features = ["binstart"] }
esp-idf-hal = "0.42"
esp-idf-svc = "0.47"
embedded-svc = "0.26"
log = "0.4"
anyhow = "1.0"

[build-dependencies]
embuild = "0.31"

# Create a separate test-only package to avoid ESP-IDF dependencies during testing
[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"