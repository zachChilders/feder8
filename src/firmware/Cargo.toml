[package]
name = "feder8-firmware"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "feder8-firmware"
path = "src/main.rs"

[[bin]]
name = "run-sim"
path = "src/sim_runner.rs"

[[bin]]
name = "test-runner"
path = "test_runner.rs"

# Test configuration
[dev-dependencies]
tokio-test = "0.4"

[dependencies]
esp-idf-sys = { version = "0.33", features = ["binstart"] }
esp-idf-hal = "0.42"
esp-idf-svc = { version = "0.47", features = ["std", "alloc"] }
embedded-svc = "0.26"
embedded-io = "0.6"
log = "0.4"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
heapless = "0.7"
chrono = { version = "0.4", features = ["serde"], default-features = false }
uuid = { version = "1.0", features = ["v4", "serde"] }
async-trait = "0.1"
embedded-nal = "0.6"
embedded-nal-async = "0.4"
tokio = { version = "1.0", features = ["rt", "macros", "time"] }
url = "2.4"

[build-dependencies]
embuild = "0.31"

# Create a separate test-only package to avoid ESP-IDF dependencies during testing
[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"