[package]
name = "feder8-firmware"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "feder8-firmware"
path = "src/main.rs"

[[bin]]
name = "run-sim"
path = "src/sim_runner.rs"

[dependencies]
esp-idf-sys = { version = "0.33", features = ["binstart"] }
esp-idf-hal = "0.42"
esp-idf-svc = "0.47"
embedded-svc = "0.26"
log = "0.4"
anyhow = "1.0"

[build-dependencies]
embuild = "0.31"

[profile.release]
opt-level = "s"

[profile.dev]
debug = true
opt-level = "z"