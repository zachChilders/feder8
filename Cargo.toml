[workspace]
members = [
    ".",
    "native",
]

[package]
name = "feder8-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "feder8_core"
path = "src/lib.rs"

[features]
default = ["native"]
native = ["tokio", "reqwest", "actix-web", "sqlx", "tracing", "mockall"]
esp32 = ["heapless", "esp-idf-sys", "esp-idf-hal", "esp-idf-svc", "embedded-svc", "embedded-io", "embedded-nal", "embedded-nal-async", "log", "url"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
async-trait = "0.1"
anyhow = "1.0"
thiserror = "1.0"

# Conditional dependencies for different targets
heapless = { version = "0.7", optional = true }
tokio = { version = "1.0", features = ["rt", "macros", "time"], optional = true }
reqwest = { version = "0.11", features = ["json", "rustls-tls"], optional = true }
actix-web = { version = "4.4", optional = true }
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid"], optional = true }
tracing = { version = "0.1", optional = true }
mockall = { version = "0.12", optional = true }

# ESP32 specific dependencies
esp-idf-sys = { version = "0.33", features = ["binstart"], optional = true }
esp-idf-hal = { version = "0.42", optional = true }
esp-idf-svc = { version = "0.47", features = ["std", "alloc"], optional = true }
embedded-svc = { version = "0.26", optional = true }
embedded-io = { version = "0.6", optional = true }
embedded-nal = { version = "0.6", optional = true }
embedded-nal-async = { version = "0.4", optional = true }
log = { version = "0.4", optional = true }
url = { version = "2.4", optional = true }

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.0"
rand = "0.8"
tokio = { version = "1.0", features = ["rt", "macros", "time"] }
actix-web = { version = "4.4" }
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
mockall = "0.12"

# Profile configurations for workspace
[profile.release]
opt-level = "s"

[profile.dev]
debug = true
opt-level = "z"

